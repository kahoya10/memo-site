<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e7" />
    <title>흑연 펜</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar" aria-label="필기 도구">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>흑연 펜</span>
        </div>

        <div class="tool-group" aria-label="연필 농도">
          <button class="grade-button" data-grade="2H" type="button">2H</button>
          <button class="grade-button is-active" data-grade="HB" type="button">HB</button>
          <button class="grade-button" data-grade="2B" type="button">2B</button>
          <button class="grade-button" data-grade="4B" type="button">4B</button>
        </div>

        <label class="size-control">
          <span>굵기</span>
          <input id="size" type="range" min="1" max="14" step="0.5" value="4" />
          <output id="size-output" for="size">4</output>
        </label>

        <div class="actions">
          <button id="clear" class="text-button" type="button">모두 지우기</button>
          <button id="save" class="save-button" type="button">PNG 저장</button>
        </div>
      </header>

      <section class="paper-wrap" aria-label="필기 영역">
        <canvas id="paper" aria-label="연필로 필기할 수 있는 캔버스"></canvas>
        <div id="hint" class="hint" aria-hidden="true">
          <strong>여기에 써보세요</strong>
          <span>펜 압력과 속도에 따라 흑연의 농담이 달라집니다.</span>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
