<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ea" />
  <title>종이, 오늘 — 나의 필기 공간</title>
  <meta name="description" content="캘린더, 일정 정리, 미리 알림, 나의 노트를 한곳에서 관리하는 필기 앱" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>
        </span>
        <span><strong>종이, 오늘</strong><small>MY DAILY NOTE</small></span>
      </div>
      <div class="today-chip" id="todayChip"></div>
    </header>

    <section class="hero">
      <div class="intro">
        <p class="eyebrow">기록으로 시작하는 하루</p>
        <h1>오늘을<br />적어보세요.</h1>
        <p class="intro-copy">해야 할 일과 떠오른 생각, 잊지 말아야 할 약속까지. 당신의 하루를 한 장씩 차분히 모아두는 공간이에요.</p>
        <span class="line" aria-hidden="true"></span>
      </div>

      <div class="feature-grid" aria-label="주요 기능">
        <button class="feature-card calendar-card" data-open="calendar" type="button">
          <span class="card-top"><span class="card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><span class="arrow">↗</span></span>
          <h2>캘린더</h2><p>날짜별 일정을 확인하고<br />새로운 약속을 추가해요.</p><span class="card-meta" id="calendarMeta"></span>
        </button>
        <button class="feature-card schedule-card" data-open="schedule" type="button">
          <span class="card-top"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3 6l1.4 1.4L7 4.8M3 12l1.4 1.4L7 10.8M3 18l1.4 1.4L7 16.8"/></svg></span><span class="arrow">↗</span></span>
          <h2>일정 정리표</h2><p>중요도와 시간을 정리하고<br />완료한 일은 체크해요.</p><span class="card-meta" id="scheduleMeta"></span>
        </button>
        <button class="feature-card reminder-card" data-open="reminders" type="button">
          <span class="card-top"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><span class="arrow">↗</span></span>
          <h2>미리 알림</h2><p>오늘과 내일의 중요한 일정을<br />한눈에 놓치지 않아요.</p><span class="card-meta" id="reminderMeta"></span>
        </button>
        <button class="feature-card notes-card" data-open="notes" type="button">
          <span class="card-top"><span class="card-icon"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7V5a2 2 0 0 1 2-2h5l2 2h5"/></svg></span><span class="arrow">↗</span></span>
          <h2>나의 노트</h2><p>폴더별로 필기를 모으고<br />언제든 다시 열어봐요.</p><span class="card-meta" id="notesMeta"></span>
        </button>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="workspace-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <header class="panel-head">
        <div><p class="panel-kicker" id="panelKicker"></p><h2 id="panelTitle"></h2></div>
        <div class="panel-actions">
          <button class="secondary-btn" id="goHome" type="button">시작 화면</button>
          <button class="icon-btn" id="closePanel" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>
      <div class="panel-body" id="panelBody"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
