<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 공책 · 삽구의 서당</title>
  <link rel="stylesheet" href="../notes-site/static/notes/site.css">
  <link rel="stylesheet" href="./cloud.css">
</head>
<body>
<main class="site-main">
  <section class="library-shell">
    <header class="page-heading">
      <div><a class="back-link" href="../index.html">← 시작 화면</a><h1>내 공책</h1></div>
      <div class="mode-buttons" id="libraryActions" hidden>
        <button class="small-button" id="inviteButton" type="button" hidden>새 초대 코드</button>
        <button class="small-button" id="signOut" type="button">로그아웃</button>
        <button class="primary-button" data-open-notebook type="button">+ 새 공책</button>
      </div>
    </header>
    <p id="cloudStatus" role="status">공책을 불러오는 중…</p>

    <section class="empty-state" id="signInPanel" hidden>
      <h2>로그인</h2>
      <form id="accountForm" class="stack-form" method="post">
        <label>이메일 <input name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" name="action" value="signin" type="submit">로그인</button>
        <button class="secondary-button" name="action" value="signup" type="submit">이메일로 가입</button>
      </form>
    </section>

    <section class="empty-state" id="invitePanel" hidden>
      <h2>초대 코드 입력</h2>
      <form id="inviteForm" class="stack-form" method="post">
        <label>초대 코드 <input name="code" required maxlength="36" autocomplete="off"></label>
        <button class="primary-button" type="submit">공책 열기</button>
      </form>
    </section>

    <section id="library" hidden>
      <form id="bookSearch" class="search-bar" role="search">
        <label class="sr-only" for="notebook-search">공책 찾기</label>
        <input id="notebook-search" type="search" placeholder="공책·과목·필기 내용에서 찾기">
        <button type="submit">찾기</button>
      </form>
      <div class="notebook-grid" id="notebooks"></div>
      <section class="empty-state" id="noBooks" hidden><h2 id="noBooksTitle">첫 공책을 펼쳐 볼까요?</h2><button class="primary-button" type="button" data-open-notebook>공책 만들기</button></section>
    </section>
  </section>
</main>

<dialog id="notebookDialog" class="form-dialog template-form" aria-labelledby="notebookDialogTitle">
  <form id="notebookForm" class="stack-form">
    <div class="dialog-heading"><h2 id="notebookDialogTitle">공책 만들기</h2><button id="closeNotebook" type="button" class="icon-button" aria-label="닫기">×</button></div>
    <div class="notebook-fields"><label>공책 제목 <input name="title" maxlength="80" required></label><label>과목 <input name="subject" maxlength="40" required></label></div>
    <fieldset class="cover-fieldset"><legend>표지 디자인</legend><div id="coverOptions" class="template-grid cover-template-grid"></div></fieldset>
    <label>사용자 PNG 표지 <input name="cover" type="file" accept="image/png"></label>
    <p id="notebookStatus" role="status"></p>
    <button class="primary-button wide" type="submit">저장</button>
  </form>
</dialog>

<template id="notebookCard"><article class="notebook-card">
  <a class="a4-cover"><span class="cover-subject"></span><strong></strong><small></small></a>
  <div class="notebook-actions">
    <a class="small-button primary" data-edit>필기하기</a><a class="small-button" data-study>학습하기</a><a class="small-button" data-organize>정리하기</a>
    <button class="small-button cover-edit-link" data-cover type="button">표지 변경</button>
  </div>
  <button class="danger-link" data-remove type="button">공책 삭제</button>
</article></template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.3/dist/umd/supabase.js" integrity="sha384-+ZU0FLgmXrUNVwx4Nmuay6i8PA8Ouf1KPCdacpklfY0SOT3teDcnp9j74VIF2evS" crossorigin="anonymous"></script>
<script type="module" src="./library.js"></script>
</body>
</html>
