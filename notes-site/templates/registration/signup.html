{% extends "base.html" %}
{% block title %}회원가입 · 삽구의 서당{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">친구만 들어오는 작은 서당</p>
  <h1>초대받고 시작하기</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }} {{ field }}
        {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
        {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      </label>
    {% endfor %}
    <button class="primary-button wide" type="submit">회원가입</button>
  </form>
  <p class="auth-switch">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p>
</section>
{% endblock %}
