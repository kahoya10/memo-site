{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}삽구의 서당{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'notes/site.css' %}?v=20261126-3">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if messages %}
    <section class="messages" aria-label="알림" data-auto-dismiss="1500">
      {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
    </section>
  {% endif %}

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <script>
    function newRecordId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;
      const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
    }
    document.querySelectorAll('[data-auto-dismiss]').forEach(notification => {
      const delay = Number(notification.dataset.autoDismiss) || 1500;
      window.setTimeout(() => {
        notification.classList.add('is-hiding');
        window.setTimeout(() => notification.remove(), 220);
      }, delay);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
